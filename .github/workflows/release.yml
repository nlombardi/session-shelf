name: Release

# Trigger by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    # Publishing tokens are scoped to the single step that needs each one, so
    # dependency installs, tests and packaging never see them.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce@4.1.0 package --no-dependencies -o session-shelf.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: session-shelf.vsix
          generate_release_notes: true

      # Publishes to the VS Code Marketplace only if the VSCE_PAT secret is configured.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT not set; skipping."; exit 0; fi
          npx --yes @vscode/vsce@4.1.0 publish --no-dependencies --packagePath session-shelf.vsix -p "$VSCE_PAT"

      # Optional: also publish to Open VSX if OVSX_PAT is set.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT not set; skipping."; exit 0; fi
          npx --yes ovsx@1.3.0 publish session-shelf.vsix -p "$OVSX_PAT"
